async function openDetail(type,id){let x=getItem(type,id);state.current={type,id};let ing=type==="recipe"?x.ingredients:x.ingredients,garn=type==="recipe"?x.seasonings:x.garnish;$("#detail").innerHTML=`<div class="cover"><img id="detailImg" src="${esc(x.image||IMG[type])}"><div class="coverBtns"><button data-action="close-detail">‹</button><button data-action="edit-item" data-type="${type}" data-id="${id}">✎</button></div></div><div class="detailbody"><h1>${esc(x.name)}${type==="drink"?` <small>/ ${esc(x.chineseName)}</small>`:""}</h1><div>${type==="recipe"?`<span class="badge">${esc(x.cuisine)}</span><span class="badge">辣度 ${x.spicyLevel}/3</span><span class="badge">${x.time} min</span><span class="badge">难度 ${x.difficulty}/5</span>${x.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join("")}`:`<span class="badge">ABV ${x.abv}%</span><span class="badge">难度 ${x.difficulty}/5</span><span class="badge">${esc(x.base)}</span>${x.tasteTags.map(t=>`<span class="badge">${esc(t)}</span>`).join("")}`}</div><div class="detailsec"><h3>🛒 ${type==="recipe"?"食材":"配方"}</h3>${ing.map(i=>`<div class="ingredient"><span>${esc(i.name)}</span><span>${esc(i.amount)}</span></div>`).join("")}</div><div class="detailsec"><h3>🥣 ${type==="recipe"?"调料":"辅料 / 装饰"}</h3>${garn.length?garn.map(i=>`<div class="ingredient"><span>${esc(i.name)}</span><span>${esc(i.amount)}</span></div>`).join(""):'<div class="sub">暂无</div>'}</div><div class="detailsec"><h3>👩🏻‍🍳 做法</h3>${x.steps.map((s,i)=>`<div class="step"><i>${i+1}</i><span>${esc(s)}</span></div>`).join("")}</div>${x.notes?`<div class="detailsec"><h3>📝 备注</h3><div class="sub">${esc(x.notes)}</div></div>`:""}<div class="detailsec"><h3>🎬 参考视频</h3>${x.video?`<a href="${esc(x.video)}" target="_blank" rel="noopener">打开参考视频</a>`:'<div class="sub">暂无</div>'}</div><div class="detailsec"><div class="sectionhead"><h3>我的制作记录</h3><button class="link" data-action="creation" data-type="${type}" data-id="${id}">＋ 上传照片</button></div><div id="creationList">${(x function editItem(type,id){let x=id?getItem(type,id):null,n=type==="recipe",v=(k,def="")=>esc(x?.[k]??def);openSheet(`<h2>${x?"编辑":"新增"}${n?"菜谱":"酒单"}</h2><form id="itemForm" data-type="${type}" data-id="${id||""}"><div class="twocol"><div class="field"><label>${n?"菜名":"英文名"}</label><input name="name" required value="${v("name")}"></div><div class="field"><label>${n?"菜系":"中文名"}</label><input name="second" value="${n?v("cuisine"):v("chineseName")}"></div></div><div class="twocol"><div class="field"><label>${n?"一级分类":"低度 / 高度"}</label><select name="category">${(n?["早餐","快餐","正餐","甜品","健康"]:["低度","高度"]).map(c=>`<option ${x?.category===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label>${n?"时间（分钟）":"ABV %"}</label><input name="metric" type="number" value="${n?v("time",20):v("abv",12)}"></div></div><div class="twocol"><div class="field"><label>难度 1–5</label><input name="difficulty" type="number" min="1" max="5" value="${v("difficulty",2)}"></div><div class="field"><label>${n?"辣度 0–3":"基酒"}</label><input name="extra" ${n?'type="number" min="0" max="3"':""} value="${n?v("spicyLevel",0):v("base")}"></div></div><div class="field"><label>${n?"Tags（逗号分隔）":"风味标签（逗号分隔）"}</label><input name="tags" value="${esc((n?x?.tags:x?.tasteTags)?.join(",")||"")}"></div><div class="field"><label>上传封面图片</label><input name="cover" type="file" accept="image/*"><div class="coverUploadNote">封面独立保存；制作记录照片不会替换封面。图片会保持原比例显示。</div></div><div class="field"><label>封面 / 参考图 URL（可选）</label><input name="image" value="${v("image",IMG[type])}"></div><div class="field"><label>${n?"食材":"配方"}（每行：名称 | 数量）</label><textarea name="ingredients">${esc(fmtPairs(x?.ingredients||[]))}</textarea></div><div class="field"><label>${n?"调料":"辅料 / 装饰"}</label><textarea name="garnish">${esc(fmtPairs(n?x?.seasonings:x?.garnish)||"")}</textarea></div><div class="field"><label>做法（每行一步）</label><textarea name="steps">${esc((x?.steps||[]).join("\n"))}</textarea></div><div class="field"><label>参考视频 URL async function saveItem(f){let fd=new FormData(f),type=f.dataset.type,n=type==="recipe",id=f.dataset.id,list=n?Store.data.recipes:Store.data.drinks,old=id?getItem(type,id):null,cover=fd.get("cover"),coverPhotoId=old?.coverPhotoId||"";if(cover&&cover.size){coverPhotoId=uid("cover-");await Photos.put(coverPhotoId,cover)}let obj={...(old||{}),id:id||uid(type+"-"),name:fd.get("name"),category:fd.get("category"),difficulty:+fd.get("difficulty")||1,image:fd.get("image")||IMG[type],coverPhotoId,ingredients:parsePairText(fd.get("ingredients")),steps:parseText(fd.get("steps")),video:fd.get("video"),notes:fd.get("notes"),creations:old?.creations||[]};if(n)Object.assign(obj,{cuisine:fd.get("second"),time:+fd.get("metric")||0,spicyLevel:+fd.get("extra")||0,tags:fd.get("tags").split(",").map(s=>s.trim()).filter(Boolean),seasonings:parsePairText(fd.get("garnish"))});else Object.assign(obj,{chineseName:fd.get("second"),abv:+fd.get("metric")||0,base:fd.get("extra"),tasteTags:fd.get("tags").split(",").map(s=>s.trim()).filter(Boolean),garnish:parsePairText(fd.get("garnish"))});if(old)list[list.indexOf(old)]=obj;else list.unshift(obj);Store.save();closeSheet();render();openDetail(type,obj.id);toast("已保存")}

function diary(){let y=state.calendar.getFullYear(),m=state.calendar.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),cells="<div></div>".repeat(first);for(let i=1;i<=count;i++){let date=`${y}-${String(m+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;cells+=`<button class="day ${date===today()?"today":""} ${Store.data.logs[date]?"has":""}" data-action="day" data-date="${date}">${i}</button>`}openSheet(`<div class="calendarHead"><button class="iconbtn" data-action="cal-prev">‹</button><h2>${y} 年 ${m+1} 月</h2><button class="iconbtn" data-action="cal-next">›</button></div><div class="calgrid">${["日","一","二","三","四","五","六"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>`)}function dayEditor(date){let l=Store.data.logs[date]||{mood:"",breakfast:[],lunch:[],dinner:[],snack:[],drinks:[],note:""},unlock=[...Store.data.recipes,...Store.data.drinks].filter(x=>x.creations?.some(c=>c.date===date&&c.photoId));openSheet(`<h2>${date}</h2><form id="dayForm" data-date="${date}"><div class="field"><label>心情</label><div class="tabs">${["🥰","🙂","😐","🥲","😵‍💫"].map(x=>`<label class="pill"><input type="radio" name="mood" value="${x}" ${l.mood===x?"checked":""}> ${x}</label>`).join("")}</div></div>${["breakfast","lunch","dinner","snack"].map(m=>`<div class="field"><label>${({breakfast:"早餐",lunch:"午餐",dinner:"晚餐",snack:"加餐"})[m]}（可多选）</label><div class="picklist">${Store.data.recipes.map(r=>`<label class="pick"><input type="checkbox" name="${m}" value="${r.id}" ${(l[m]||[]).some(e=>e.recipeId===r.id)?"checked":""}>${esc(r.name)}</label>`).join("")}</div><input name="${m}Custom" placeholder="临时食物，用顿号分隔" value="${esc((l[m]||[]).filter(e=>e.customText).map(e=>e.customText).join("、"))}"></div>`).join("")}<div class="field"><label>喝酒记录</label><div class="picklist">${Store.data.drinks.map(d=>{let e=(l.drinks||[]).find(e=>e.drinkId===d.id);return`<label class="pick"><input type="checkbox" name="drinks" value="${d.id}" ${e?"checked":""}>${esc(d.name)}<input style="width:58px;margin-left:auto" type="number" min="1" name="qty-${d.id}" value="${e?.quantity||1}"></label>`}).join("")}</div><input name="drinkCustom" placeholder="也可手动输入"></div><div class="field"><label>当天解锁（自动）</label><div class="sub">${unlock.map(x=>x.name).join("、")||"无"}</div></div><div class="field"><label>今日动态 / 一句话</label><textarea name="note">${esc(l.note||"")}</textarea></div><button class="primary">保存今天</button></form>`)}function saveDay(f){let fd=new FormData(f),entry={mood:fd.get("mood")||"",note:fd.get("note"),drinks:fd.getAll("drinks").map(drinkId=>({drinkId,quantity:+fd.get("qty-"+drinkId)||1}))};["breakfast","lunch","dinner","snack"].forEach(m=>{entry[m]=fd.getAll(m).map(recipeId=>({recipeId}));let s=fd.get(m+"Custom").split("、").map(x=>x.trim()).filter(Boolean);entry[m].push(...s.map(customText=>({customText}))) });let dc=fd.get("drinkCustom").trim();if(dc)entry.drinks.push({customText:dc,quantity:1});Store.data.logs[f.dataset.date]=entry;Store.save();render();closeSheet();toast("每日记录已保存")}
function stats(){let d=Store.data;openSheet(`<h2>数据统计</h2><div class="stats"><div class="card stat"><strong>${d.recipes.filter(unlocked).length}</strong><span>已解锁菜谱</span></div><div class="card stat"><strong>${d.drinks.filter(unlocked).length}</strong><span>已解锁酒单</span></div><div class="card stat"><strong>${Object.keys(d.logs).length}</strong><span>记录天数</span></div><div class="card stat"><strong>${[...d.recipes,...d.drinks].reduce((n,x)=>n+x.creations.length,0)}</strong><span>制作记录</span></div></div>`)}function management(type){let a=type==="recipe"?Store.data.recipes:Store.data.drinks;openSheet(`<h2>${type==="recipe"?"菜谱":"酒单"}管理</h2><button class="primary" data-action="edit-item" data-type="${type}">＋ 新增</button>${a.map(x=>`<div class="row"><span class="grow"><b>${esc(x.name)}</b><small>${esc(x.category)}</small></span><button class="link" data-action="edit-item" data-type="${type}" data-id="${x.id}">编辑</button></div>`).join("")}`)}
async function dataManage(){openSheet(`<h2>设置 / 数据管理</h2><div class="card empty" style="text-align:left">结构化数据保存在 localStorage，照片保存在 IndexedDB。导出备份会将两者一起打包为 JSON。</div><button class="primary" data-action="export">导出全部数据</button><label class="secondary" style="display:block;text-align:center"><input id="importFile" type="file" accept="application/json" hidden>导入备份</label><button class="danger" data-action="reset">恢复初始数据</button>`)}async function exportData(){let ph=await Photos.all(),photos={};for(let[k,b]of Object.entries(ph))photos[k]=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)});let blob=new Blob([JSON.stringify({app:"My Kitchen",exportedAt:new Date().toISOString(),data:Store.data,photos},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`my-kitchen-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast("备份已导出")}
async function importData(file){try{let b=JSON.parse(await file.text());Store.data=Store.migrate(b.data||b);Store.save();if(b.photos){for(let[k,v]of Object.entries(b.photos)){let blob=await(await fetch(v)).blob();await Photos.put(k,blob)}}render();closeSheet();toast("备份已导入")}catch(e){alert("导入失败：备份文件格式不正确")}}
const INV_CN={"Gin":"金酒","Vodka":"伏特加","White Rum":"白朗姆酒","Tequila":"龙舌兰","Whisky":"威士忌","Amaretto":"杏仁利口酒","Aperol":"阿佩罗","Campari":"金巴利","Cointreau":"君度橙酒","Kahlúa":"咖啡利口酒","Peach Liqueur":"桃味利口酒","Blue Curaçao":"蓝橙力娇酒","Sweet Vermouth":"甜味美思","Dry Vermouth":"干味美思","Prosecco":"普罗塞克起泡酒","Soda":"苏打水","Tonic":"汤力水","Ginger Beer":"姜汁啤酒","Coke":"可乐","Orange Juice":"橙汁","Pineapple Juice":"菠萝汁","Cranberry Juice":"蔓越莓汁","Lime Juice":"青柠汁","Lemon Juice":"柠檬汁","Simple Syrup":"糖浆","Grenadine":"红石榴糖浆","Coconut Cream":"椰浆","Espresso":"浓缩咖啡","Cream":"淡奶油","Egg White":"蛋清","Angostura Bitters":"安格仕苦精","Lemon":"柠檬","Lime":"青柠","Mint":"薄荷","Orange":"橙子","Pineapple":"菠萝","Olive":"橄榄","Cherry":"樱桃","Coffee Beans":"咖啡豆","Salt":"盐"};const INV_CAT_CN={"Vermouth / Aperitif":"味美思 / 开胃酒","Mixer":"调和饮料"};function invLabel(name){return INV_CN[name]?`${INV_CN[name]} · ${name}`:name}
const openDetailBase=openDetail;openDetail=async function(type,id){await openDetailBase(type,id);let x=getItem(type,id),img=$("#detailImg");if(!img)return;if(x.coverPhotoId){img.src=await photoSrc(x.coverPhotoId,x.image);img.style.objectFit="contain"}else{img.insertAdjacentHTML("afterend",spriteFor(x,type));img.remove()}let h=$("#detail .detailbody h1");if(type==="drink"&&h)h.innerHTML=`${esc(x.chineseName)} <small>· ${esc(x.name)}</small>`}
function upgradeGeneratedVisuals(){let result=$("#sheet .random-result");if(result&&!result.dataset.upgraded){let name=result.querySelector("h2")?.textContent?.trim(),type=Store.data.recipes.some(x=>x.name===name)?"recipe":"drink",x=(type==="recipe"?Store.data.recipes:Store.data.drinks).find(x=>x.name===name);if(x){let img=result.querySelector("img");if(img){let box=document.createElement("div");box.className="generated-preview";box.innerHTML=spriteFor(x,type);img.replaceWith(box);if(type==="drink")result.querySelector("h2").textContent=`${x.chineseName} · ${x.name}`;result.dataset.upgraded="1"}}}let sh=$("#sheet");if(sh?.querySelector("h2")?.textContent.includes("我家现在有什么")){sh.querySelectorAll(".ingredient span").forEach(el=>{let raw=el.textContent.trim();if(INV_CN[raw])el.textContent=invLabel(raw)});sh.querySelectorAll(".detailsec h3").forEach(el=>{let raw=el.textContent.trim();if(INV_CAT_CN[raw])el.textContent=INV_CAT_CN[raw]})}}
function upgradeInventoryResults(){let sh=$("#sheet");if(!sh?.querySelector("h2")?.textContent.startsWith("当前可调"))return;sh.querySelectorAll(".row small").forEach(el=>{let t=el.textContent;Object.entries(INV_CN).forEach(([en,cn])=>t=t.replaceAll(en,`${cn}(${en})`));el.textContent=t})}new MutationObserver(()=>requestAnimationFrame(()=>{upgradeGeneratedVisuals();upgradeInventoryResults()})).observe($("#detail"),{childList:true,subtree:true});new MutationObserver(()=>requestAnimationFrame(()=>{upgradeGeneratedVisuals();upgradeInventoryResults()})).observe($("#sheet"),{childList:true,subtree:true});
document.addEventListener("input",e=>{if(e.target.id==="recipeSearch")renderRecipes();if(e.target.id==="drinkSearch")renderDrinks()});document.addEventListener("submit",e=>{e.preventDefault();let f=e.target;if(f.id==="itemForm")saveItem(f);if(f.id==="creationForm")saveCreation(f);if(f.id==="inventoryForm")saveInventory(f);if(f.id==="planForm")savePlan(f);if(f.id==="mealForm")saveMeals(f);if(f.id==="dayForm")saveDay(f)});document.addEventListener("change",e=>{if(e.target.id==="importFile"&&e.target.files[0])importData(e.target.files[0])});document.addEventListener("click",e=>{let b=e.target.closest("[data-page],[data-action]");if(!b)return;if(b.dataset.page){state.page=b.dataset.page;$$('.page').forEach(x=>x.classList.toggle('active',x.id===state.page));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===state.page));return}let a=b.dataset.action;if(a==="close-sheet")closeSheet();if(a==="close-detail")$("#detail").classList.remove("open");if(a==="detail"){closeSheet();openDetail(b.dataset.type,b.dataset.id)}if(a==="edit-item")editItem(b.dataset.type,b.dataset.id);if(a==="creation")creation(b.dataset.type,b.dataset.id);if(a==="recipe-filter"){state.recipeFilter=b.dataset.value;renderRecipes()}if(a==="drink-filter"){state.drinkFilter=b.dataset.value;renderDrinks()}if(a==="random")random(b.dataset.type);if(a==="random-filter")random(b.dataset.type,b.dataset.value);if(a==="random-open"){closeSheet();openDetail(b.dataset.type,b.dataset.id)}if(a==="inventory")inventory();if(a==="plans")plans();if(a==="edit-plan")editPlan(b.dataset.id);if(a==="plan")planDetail(b.dataset.id);if(a==="meal")mealEditor(b.dataset.plan,+b.dataset.day,b.dataset.meal);if(a==="diary")diary();if(a==="cal-prev"){state.calendar.setMonth(state.calendar.getMonth()-1);diary()}if(a==="cal-next"){state.calendar.setMonth(state.calendar.getMonth()+1);diary()}if(a==="day")dayEditor(b.dataset.date);if(a==="stats")stats();if(a==="manage-recipes")management("recipe");if(a==="manage-drinks")management("drink");if(a==="data")dataManage();if(a==="export")exportData();if(a==="reset"&&confirm("确定恢复初始数据吗？当前菜谱、酒单、计划与记录会被清空。")){if(confirm("再次确认：此操作不可撤销。是否继续？")){Store.reset();Photos.clear();render();closeSheet();toast("已恢复初始数据")}}if(a==="delete-item"&&confirm("确定删除这条内容吗？")){let f=b.closest("form"),list=f.dataset.type==="recipe"?Store.data.recipes:Store.data.drinks;Store.data[f.dataset.type==="recipe"?"recipes":"drinks"]=list.filter(x=>x.id!==f.dataset.id);Store.save();closeSheet();$("#detail").classList.remove("open");render()}if(a==="delete-plan"&&confirm("确定删除这个计划吗？")){let f=b.closest("form");Store.data.plans=Store.data.plans.filter(x=>x.id!==f.dataset.id);Store.save();render();plans()}});$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeSheet()});Store.load();render();hydratePhotos();
})();
